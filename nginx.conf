# Same headers as public/staticwebapp.config.json and vercel.json. `always` keeps them on error responses too.
# nginx only inherits server-level add_header when a location sets none, so the /assets/ block repeats them.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  # The router is hash-based, so every real file is served directly; unknown paths fall back to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
